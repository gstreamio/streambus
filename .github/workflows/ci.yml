name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GO_VERSION: '1.26.6'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        run: |
          # golangci-lint-action@v4 hardcodes v1-only CLI flags
          # (--out-format=github-actions), which a v2 binary rejects
          # outright - and v1's "latest" resolution (e.g. v1.64.8) was
          # built with an older Go toolchain than go.mod's `go 1.26.6`
          # directive, which v1 itself refuses to run against. Install via
          # `go install` (Go's own module proxy/checksum verification)
          # rather than the release-artifact install script, which hit a
          # checksum mismatch against the GitHub release tarball.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        # -short: this job has no live broker/multi-node cluster to talk to,
        # so integration-style tests (already guarded with
        # `if testing.Short() { t.Skip(...) }`) must be skipped here, same
        # as test.yml's "Unit Tests" job. Without it, e.g.
        # pkg/consensus.TestNode_Snapshot hits a real (separate,
        # pre-existing) deadlock in RaftNode.Stop() under -race and times
        # out the whole job after 10m.
        run: go test -v -short -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build broker
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s" \
            -o bin/streambus-broker \
            ./cmd/broker

      - name: Upload broker artifact
        uses: actions/upload-artifact@v4
        with:
          name: streambus-broker
          path: bin/streambus-broker

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build broker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: streambus/broker:test
          build-args: |
            VERSION=test
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build operator image
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/kubernetes/operator
          file: ./deploy/kubernetes/operator/Dockerfile
          push: false
          tags: streambus/operator:test
          build-args: |
            VERSION=test
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run integration tests
        run: |
          # Start the full 3-node cluster - broker1.yaml hardcodes all three
          # brokers as Raft peers, so starting broker1 alone can never reach
          # quorum (1 of 3) and never elects a leader, leaving every request
          # that needs consensus (e.g. CreateTopic) to hang or reset the
          # connection.
          docker compose up -d

          # Wait for the cluster to elect a leader
          sleep 20

          # Run integration tests
          go test -v -tags=integration ./tests/integration/...

          # Cleanup
          docker compose down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif -stdout -verbose=text ./...'

      - name: Post-process SARIF file
        if: always()
        run: |
          # Remove invalid fixes objects that cause SARIF validation errors
          # SARIF spec requires artifactChanges to have at least 1 element if present
          if [ -f gosec-results.sarif ]; then
            jq 'walk(if type == "object" and has("results") then .results |= map(del(.fixes)) else . end)' gosec-results.sarif > gosec-results-fixed.sarif
            mv gosec-results-fixed.sarif gosec-results.sarif
          fi

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'
