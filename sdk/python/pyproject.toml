[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streambus-sdk"
version = "0.2.0"
description = "Python SDK for StreamBus, a distributed streaming platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "StreamBus" }]
keywords = ["streambus", "streaming", "messaging", "queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
# The SDK speaks the StreamBus binary protocol over a plain socket and needs
# nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/gstreamio/streambus"
Repository = "https://github.com/gstreamio/streambus"

[tool.setuptools.packages.find]
include = ["streambus_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
